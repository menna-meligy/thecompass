<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="البوصلة">
  <!-- outer ring -->
  <circle cx="48" cy="48" r="42" stroke="#F59E0B" stroke-width="3"/>
  <!-- cardinal ticks -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="7" x2="48" y2="16"/>
    <line x1="48" y1="80" x2="48" y2="89"/>
    <line x1="7" y1="48" x2="16" y2="48"/>
    <line x1="80" y1="48" x2="89" y2="48"/>
  </g>
  <!-- compass needle: north bright, south muted (angled toward NE) -->
  <g transform="rotate(28 48 48)">
    <polygon points="48,17 55,48 41,48" fill="#FBBF24"/>
    <polygon points="48,79 55,48 41,48" fill="#475569"/>
  </g>
  <!-- center hub -->
  <circle cx="48" cy="48" r="5" fill="#0f172a" stroke="#F59E0B" stroke-width="2.5"/>
</svg>
